{% if status == 'pending' %}
  <span {% if badge_id %}id="{{ badge_id }}"{% endif %} class="inline-flex rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700">Pending</span>
{% elif status == 'processing' %}
  <span {% if badge_id %}id="{{ badge_id }}"{% endif %} class="inline-flex rounded-full bg-blue-100 px-2 py-0.5 text-xs font-medium text-blue-700">Processing</span>
{% elif status == 'done' %}
  <span {% if badge_id %}id="{{ badge_id }}"{% endif %} class="inline-flex rounded-full bg-green-100 px-2 py-0.5 text-xs font-medium text-green-700">Done</span>
{% elif status == 'failed' %}
  <span {% if badge_id %}id="{{ badge_id }}"{% endif %} class="inline-flex rounded-full bg-red-100 px-2 py-0.5 text-xs font-medium text-red-700">Failed</span>
{% else %}
  <span {% if badge_id %}id="{{ badge_id }}"{% endif %} class="inline-flex rounded-full bg-slate-100 px-2 py-0.5 text-xs font-medium text-slate-700">Unknown</span>
{% endif %}
