<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FPA Scoping{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 min-h-screen">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto max-w-7xl px-4 py-4 flex items-center justify-between">
        <a href="{% url 'sites:list' %}" class="text-lg font-semibold tracking-tight">FPA Scoping</a>
        <div class="flex items-center gap-4 text-sm text-slate-600">
          {% if user.is_authenticated %}
            <span>{{ user.username }}</span>
            <form method="post" action="{% url 'logout' %}" style="display: inline;">
              {% csrf_token %}
              <button type="submit" class="hover:text-slate-900 cursor-pointer bg-none border-none p-0 font-inherit text-inherit">Logout</button>
            </form>
          {% endif %}
        </div>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-6">
      {% if messages %}
        <div class="space-y-3 mb-6">
          {% for message in messages %}
            <div class="rounded-lg border px-4 py-3 text-sm {% if message.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% else %}border-slate-200 bg-white text-slate-700{% endif %}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    {% block extra_js %}{% endblock %}
  </body>
</html>
