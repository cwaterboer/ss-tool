{% extends 'base.html' %}
{% block title %}Log in · FPA Scoping{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <h1 class="text-2xl font-semibold tracking-tight">Log in</h1>
    <p class="mt-2 text-sm text-slate-600">Use your account to open sites and scans.</p>

    {% if form.errors %}
      <div class="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800">
        Your username and password didn't match. Please try again.
      </div>
    {% endif %}

    <form method="post" class="mt-6 space-y-4">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label class="mb-1 block text-sm font-medium" for="id_username">Username</label>
        <input id="id_username" name="username" type="text" required autofocus class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium" for="id_password">Password</label>
        <input id="id_password" name="password" type="password" required class="w-full rounded-lg border border-slate-300 px-3 py-2">
      </div>
      <button type="submit" class="w-full rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
